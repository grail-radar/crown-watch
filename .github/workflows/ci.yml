name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the pnpm version comes from the root
      # package.json `packageManager` field. Specifying both makes the action
      # fail with a version-mismatch error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @crown-watch/api exec prisma generate

      - name: Validate Prisma schema
        # Schema-only check — never connects, but the datasource url must
        # resolve, so give it a throwaway value.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: pnpm --filter @crown-watch/api exec prisma validate

      # Build first: web typecheck needs Next's generated route types (.next/types)
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck
