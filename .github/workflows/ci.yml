name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway database for schema validation and tests. Never a real deployment.
  DATABASE_URL: postgresql://crownwatch:crownwatch@localhost:5432/crownwatch_test?schema=public

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crownwatch
          POSTGRES_PASSWORD: crownwatch
          POSTGRES_DB: crownwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crownwatch -d crownwatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the pnpm version comes from the root
      # package.json `packageManager` field. Specifying both makes the action
      # fail with a version-mismatch error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @crown-watch/api exec prisma generate

      - name: Validate Prisma schema
        run: pnpm --filter @crown-watch/api exec prisma validate

      # Build first: web typecheck needs Next's generated route types (.next/types)
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to the test database
        run: pnpm --filter @crown-watch/api exec prisma migrate deploy

      - name: Test
        run: pnpm test
