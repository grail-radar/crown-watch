name: RSS poll

# Free API hosts sleep when idle, so the API's in-process cron can't be relied on.
# This workflow pokes the ingestion endpoint on a schedule (and wakes the service).
on:
  schedule:
    - cron: "*/20 * * * *" # every 20 min (GitHub may delay/skip on load)
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Tier 1 RSS poll
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Set the API_BASE_URL repo secret to your Render URL (no trailing slash)."
            exit 1
          fi
          # Wake the free-tier instance, then poll with retries (the service can
          # briefly 5xx during cold starts or mid-deploy restarts).
          curl -fsS --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors "$API_BASE_URL/health" || true
          curl -fsS --max-time 180 --retry 4 --retry-delay 15 --retry-all-errors \
            -X POST "$API_BASE_URL/ingestion/rss/poll"

      # Turn new raw articles into brands + pending drops. Non-fatal: the poll
      # stays green even if extraction hiccups. Costs Anthropic credit per NEW
      # article (~$0.005 each on claude-opus-4-8; ~5x less on claude-haiku-4-5
      # via the ANTHROPIC_MODEL env var on the API). Re-runs are free no-ops
      # when there is nothing new.
      - name: Run LLM extraction over new items
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          curl -fsS --max-time 480 --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST "$API_BASE_URL/extraction/run?limit=30" \
            || echo "extraction failed or skipped (non-fatal)"

      # Extraction is what discovers a brand, usually from an article that
      # mentioned only its name. A brand with no website shows no purchase link
      # at all, on the site or in the channels — so the gap is filled in the same
      # run that creates it, rather than waiting for someone to notice.
      #
      # Costs an Anthropic call per brand asked about, but the pass gives up on
      # brands it cannot resolve after a few tries, so this converges instead of
      # re-billing for the same silence every twenty minutes. Non-fatal: an
      # incomplete brand must never fail the ingestion run that found it.
      - name: Fill in details for newly discovered brands
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          curl -fsS --max-time 300 --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST "$API_BASE_URL/extraction/enrich-brands?limit=10" \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -o enrich.json || echo "enrichment failed or skipped (non-fatal)"

          if [ -f enrich.json ]; then
            cat enrich.json
            jq -r '"- brands asked about: \(.considered)",
                   "- filled in: \(.updated)",
                   "- errors: \(.errors)",
                   "- still incomplete, no longer asked: \(.exhausted)"' enrich.json \
              >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
