name: RSS poll

# Free API hosts sleep when idle, so the API's in-process cron can't be relied on.
# This workflow pokes the ingestion endpoint on a schedule (and wakes the service).
on:
  schedule:
    - cron: "*/20 * * * *" # every 20 min (GitHub may delay/skip on load)
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Tier 1 RSS poll
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Set the API_BASE_URL repo secret to your Render URL (no trailing slash)."
            exit 1
          fi
          curl -fsS --max-time 180 -X POST "$API_BASE_URL/ingestion/rss/poll"

      # Turn new raw articles into brands + pending drops. Non-fatal: the poll
      # stays green even if extraction hiccups. Costs Anthropic credit per NEW
      # article (~$0.005 each on claude-opus-4-8; ~5x less on claude-haiku-4-5
      # via the ANTHROPIC_MODEL env var on the API). Re-runs are free no-ops
      # when there is nothing new.
      - name: Run LLM extraction over new items
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          curl -fsS --max-time 480 -X POST "$API_BASE_URL/extraction/run?limit=30" \
            || echo "extraction failed or skipped (non-fatal)"
